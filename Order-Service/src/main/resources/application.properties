spring.application.name=Order-Service
server.port=8002

spring.datasource.url=jdbc:mysql://localhost:3306/orderdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8001}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8003}
